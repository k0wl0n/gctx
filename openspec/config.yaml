schema: spec-driven

context: |
  Project: gctx — a Go CLI (Cobra) that manages multiple GCP accounts by pairing each
  account with a gcloud configuration ("<name>-config") and a saved copy of its
  Application Default Credentials (ADC).

  Tech stack:
  - Go (module github.com/k0wl0n/gctx), Cobra for commands, go-fuzzyfinder for the
    legacy interactive account picker.
  - Shells out to the `gcloud` CLI; never calls GCP APIs directly.
  - Task (Taskfile.yml) for build/test/docs, GoReleaser for releases (linux/darwin/windows,
    amd64/arm64, CGO_ENABLED=0), Homebrew tap + Scoop bucket.
  - Docs: README.md (primary entry point) and MkDocs on ReadTheDocs (readthedocs/),
    CLI reference generated by the hidden `gctx docs` command.

  Layout:
  - cmd/          Cobra commands (thin; one file per command)
  - pkg/config    ~/.config/gctx/config.json (accounts map + active_account)
  - pkg/adc       ADC save/restore/validate; storage ~/.config/gctx/adc/<name>_adc.json (0600)
  - pkg/gcloud    gcloud CLI wrapper
  - pkg/manager   orchestration of the above
  - pkg/watcher   ADC file change verification after login

  Conventions:
  - Conventional Commits; lowercase imperative subjects. Commit type drives auto-release
    (feat → minor, fix/docs/chore/refactor/perf → patch).
  - Supported platforms: Linux, macOS, Windows (PowerShell Core, Windows PowerShell, cmd).
  - Credentials are sensitive: never print, log, or display ADC JSON or tokens.
  - Supply chain: pin exact dependency versions, commit go.sum, 7-day minimum release age
    for every new or updated dependency, dependabot cooldown default-days: 7.
  - Keep README.md and readthedocs/ in sync with any user-visible change.

rules:
  specs:
    - Use SHALL/MUST for normative statements; every requirement needs at least one WHEN/THEN scenario.
    - Specs describe observable behavior; library and type names belong in design.md.
  tasks:
    - Each task names the files/packages it touches and how completion is verified.
    - Existing CLI stdout must stay byte-identical unless a spec requirement explicitly says otherwise.
