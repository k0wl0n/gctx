name: Auto Release

on:
  push:
    branches:
      - main

jobs:
  auto-tag:
    name: Auto Tag and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest tag
        id: get_tag
        run: |
          # Get the latest tag
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "Latest tag: $LATEST_TAG"

      - name: Determine version bump
        id: bump
        run: |
          # Get commit messages since last tag
          LATEST_TAG="${{ steps.get_tag.outputs.latest_tag }}"
          COMMITS=$(git log $LATEST_TAG..HEAD --pretty=format:"%s")
          
          echo "Commits since $LATEST_TAG:"
          echo "$COMMITS"
          
          # Determine bump type based on conventional commits
          BUMP_TYPE="none"
          
          if echo "$COMMITS" | grep -qE "^(feat|feature)(\(.+\))?!:|^BREAKING CHANGE:"; then
            BUMP_TYPE="major"
          elif echo "$COMMITS" | grep -qE "^(feat|feature)(\(.+\))?:"; then
            BUMP_TYPE="minor"
          elif echo "$COMMITS" | grep -qE "^(fix|bugfix|hotfix|perf|refactor|docs|chore)(\(.+\))?:"; then
            BUMP_TYPE="patch"
          fi
          
          echo "bump_type=$BUMP_TYPE" >> $GITHUB_OUTPUT
          echo "Bump type: $BUMP_TYPE"

      - name: Calculate new version
        id: version
        if: steps.bump.outputs.bump_type != 'none'
        run: |
          LATEST_TAG="${{ steps.get_tag.outputs.latest_tag }}"
          BUMP_TYPE="${{ steps.bump.outputs.bump_type }}"
          
          # Remove 'v' prefix
          VERSION=${LATEST_TAG#v}
          
          # Split version into parts
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          
          # Bump version based on type
          case $BUMP_TYPE in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac
          
          NEW_VERSION="v$MAJOR.$MINOR.$PATCH"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"

      - name: Create and push tag
        if: steps.bump.outputs.bump_type != 'none'
        run: |
          NEW_VERSION="${{ steps.version.outputs.new_version }}"
          
          # Generate release notes from commits
          LATEST_TAG="${{ steps.get_tag.outputs.latest_tag }}"
          COMMITS=$(git log $LATEST_TAG..HEAD --pretty=format:"- %s (%h)" --no-merges)
          
          # Create annotated tag with release notes
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git tag -a "$NEW_VERSION" -m "Release $NEW_VERSION
          
          Changes since $LATEST_TAG:
          $COMMITS"
          
          git push origin "$NEW_VERSION"
          
          echo "Created and pushed tag: $NEW_VERSION"

      - name: Skip release
        if: steps.bump.outputs.bump_type == 'none'
        run: |
          echo "No version bump needed - no conventional commits found"
          echo "Use commit prefixes: feat:, fix:, docs:, chore:, refactor:, perf:"
